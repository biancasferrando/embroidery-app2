            if (typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function') {
                lucide.createIcons();
            }
        }

        function saveState() {
            localStorage.setItem('stitchcraft_pro_app', JSON.stringify(appState));
            updateShoppingBadges();
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all transform translate-y-2 opacity-0 bg-gray-900 dark:bg-white dark:text-gray-900 border border-gray-700 dark:border-gray-200';
            
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 ${type === 'success' ? 'text-emerald-400' : 'text-amber-400'}"></i>
                <span>${msg}</span>
            `;

            container.appendChild(toast);
            safeCreateIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 200);
            }, 2500);
        }

        // Dark Mode Controller
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcons();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            const deskIcon = document.getElementById('desk-theme-icon');
            const deskText = document.getElementById('desk-theme-text');
            const mobIcon = document.getElementById('mobile-theme-icon');

            if (deskIcon) deskIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            if (deskText) deskText.textContent = isDark ? 'Light Theme' : 'Dark Theme';
            if (mobIcon) mobIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            safeCreateIcons();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            const clearBtn = document.getElementById('clear-search');
            if (searchQuery) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            renderView();
        }

        function clearSearch() {
            document.getElementById('global-search').value = '';
            handleSearch('');
        }

        function updateShoppingBadges() {
            const missingThreads = appState.threads.filter(t => t.wishlist || t.qty === 0).length;
            const deskBadge = document.getElementById('badge-shopping-desk');
            const mobBadge = document.getElementById('badge-shopping-mob');

            if (missingThreads > 0) {
                if (deskBadge) { deskBadge.textContent = missingThreads; deskBadge.classList.remove('hidden'); }
                if (mobBadge) { mobBadge.classList.remove('hidden'); }
            } else {
                if (deskBadge) deskBadge.classList.add('hidden');
                if (mobBadge) mobBadge.classList.add('hidden');
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all transform translate-y-2 opacity-0 bg-gray-900 dark:bg-white dark:text-gray-900 border border-gray-700 dark:border-gray-200';
            
            toast.innerHTML = `

            container.appendChild(toast);

            setTimeout(() => {

        // Dark Mode Controller
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcons();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            updateThemeIcons();
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            const deskIcon = document.getElementById('desk-theme-icon');
            const deskText = document.getElementById('desk-theme-text');
            const mobIcon = document.getElementById('mobile-theme-icon');

            if (deskIcon) deskIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            if (deskText) deskText.textContent = isDark ? 'Light Theme' : 'Dark Theme';
            if (mobIcon) mobIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();

        function renderConverterItems(query) {
            const q = query.toLowerCase().trim();
            const results = THREAD_CATALOG.filter(item => 
                !q || item.code.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.dmcEquiv.toLowerCase().includes(q) || item.cosmoEquiv.toLowerCase().includes(q)
            );

            if (results.length === 0) {
                return `<div class="p-8 text-center text-gray-400 text-xs bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800">No matching DMC or Cosmo thread shade found in database.</div>`;
            }

            return results.map(item => `
                <div class="bg-white dark:bg-gray-900 p-4 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl shadow-inner border border-black/10 shrink-0" style="background-color: ${item.hex}"></div>
                        <div>
                            <p class="font-bold text-sm text-gray-900 dark:text-white">${item.brand} ${item.code} - ${item.name}</p>
                            <p class="text-xs text-brand-600 dark:text-brand-500 font-medium">
                                Equivalent: ${item.brand === 'DMC' ? `Cosmo #${item.cosmoEquiv}` : `DMC #${item.dmcEquiv}`}
                            </p>
                        </div>
                    </div>
                    <button onclick="addCatalogThreadToStash('${item.brand}', '${item.code}', '${item.name}', '${item.hex}', '${item.dmcEquiv}', '${item.cosmoEquiv}')" class="px-3.5 py-1.5 bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-500 rounded-xl text-xs font-bold hover:bg-brand-100 transition active:scale-95">
                        + Add to Stash
                    </button>
                </div>
            `).join('');
        }

                            <p class="text-xs text-gray-500 dark:text-gray-400">${t.name}</p>
                        </div>
                    </div>
                    <button onclick="markPurchased('${t.id}')" class="flex items-center gap-1.5 text-xs bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-xl transition active:scale-95">

        function createEmptyState(title, subtitle) {
            const div = document.createElement('div');
            div.className = 'text-center py-20 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 p-8';
            div.innerHTML = `
                <i data-lucide="sparkles" class="w-12 h-12 text-gray-300 dark:text-gray-600 mx-auto mb-3"></i>
                <h3 class="font-bold text-base text-gray-900 dark:text-white mb-1">${title}</h3>
                <p class="text-xs text-gray-500 max-w-sm mx-auto">${subtitle}</p>
            `;
            return div;
        }

        function updateThreadQty(id, delta) {
            const thread = appState.threads.find(t => t.id === id);
            if (thread) {
                thread.qty = Math.max(0, thread.qty + delta);
                saveState();
                renderView();
            }
        }

        function toggleWishlist(id) {
            const thread = appState.threads.find(t => t.id === id);
            if (thread) {
                thread.wishlist = !thread.wishlist;
                saveState();
                renderView();
                showToast(thread.wishlist ? 'Added to Wishlist' : 'Removed from Wishlist');
            }
        }

        function markPurchased(id) {
            const thread = appState.threads.find(t => t.id === id);
            if (thread) {
                thread.qty += 1;
                thread.wishlist = false;
                saveState();
                renderView();
                showToast(`Restocked ${thread.brand} ${thread.code}!`);
            }
        }

        function addCatalogThreadToStash(brand, code, name, hex, dmcEquiv, cosmoEquiv) {
            const exists = appState.threads.find(t => t.brand === brand && t.code === code);
            if (exists) {
                exists.qty += 1;
            } else {
                appState.threads.unshift({
                    id: 't_' + Date.now(),
                    brand, code, name, hex,
                    qty: 1, wishlist: false,
                    dmcEquiv, cosmoEquiv
                });
            }
            saveState();
            showToast(`${brand} ${code} added to Stash!`);
        }

        function deleteFabric(id) {
            appState.fabrics = appState.fabrics.filter(f => f.id !== id);
            saveState();
            renderView();
            showToast('Fabric entry deleted');
        }

        function deleteEquipment(id) {
            appState.equipment = appState.equipment.filter(e => e.id !== id);
            saveState();
            renderView();
            showToast('Equipment entry deleted');
        }

                    </button>

                        <button onclick="importDataJSON()" class="w-full mt-3 bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white font-bold py-2.5 rounded-xl transition">Import & Restore</button>

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');

            backdrop.classList.add('opacity-0');
            box.classList.add('scale-95');
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 200);
        }

        function exportDataJSON() {
            const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", jsonStr);
            dlAnchor.setAttribute("download", `stitchcraft_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('Data exported successfully!');
        }

        function importDataJSON() {
            const fileInput = document.getElementById('import-json-file');
            if (!fileInput.files || fileInput.files.length === 0) {
                showToast('Please select a JSON backup file first', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.projects && parsed.threads) {
                        appState = parsed;
                        saveState();
                        closeModal();
                        renderView();
                        showToast('Backup restored successfully!');
                    } else {
                        showToast('Invalid backup file structure', 'error');
                    }
                } catch(err) {
                    showToast('Failed to parse backup JSON', 'error');
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        function saveNewProject(e) {
            e.preventDefault();
            const title = document.getElementById('m-p-title').value;
            const pattern = document.getElementById('m-p-pattern').value || 'Pattern';
            const designer = document.getElementById('m-p-designer').value || 'Self';

            const fabric = document.getElementById('m-p-fabric').value || '14ct Aida';

            appState.projects.unshift({
                id: 'p_' + Date.now(),
                title, pattern, designer,
                status: 'Planned', progress: 0,
                startDate: new Date().toISOString().slice(0,10),
                targetDate: '2026-12-31',
                hoopSize, fabric, notes: '', threadsNeeded: []

            saveState();
            closeModal();
            renderView();
            showToast('Project created!');

        function saveNewEquipment(e) {
            e.preventDefault();

            const qty = parseInt(document.getElementById('m-e-qty').value) || 1;

            appState.equipment.unshift({
                id: 'e_' + Date.now(),

        function saveNewThread(e) {
            e.preventDefault();
            const brand = document.getElementById('m-t-brand').value;
            const code = document.getElementById('m-t-code').value;
            const name = document.getElementById('m-t-name').value;
            const hex = document.getElementById('m-t-hex').value;
            const qty = parseInt(document.getElementById('m-t-qty').value);

            appState.threads.unshift({
                id: 't_' + Date.now(),
                brand, code, name, hex, qty, wishlist: false
            });

            saveState();
            closeModal();
            renderView();
            showToast('Thread added!');
        }

        function updateProjectProgress(id, val) {
            const p = appState.projects.find(proj => proj.id === id);
            if (p) {
                p.progress = parseInt(val);
                if (p.progress === 100) p.status = 'Completed';
                else if (p.progress > 0 && p.status === 'Planned') p.status = 'In Progress';

                document.getElementById('p-modal-val').textContent = `${p.progress}%`;
                saveState();
                renderView();
            }
        }

        function deleteProject(id) {
            appState.projects = appState.projects.filter(p => p.id !== id);
            saveState();
            closeModal();
            renderView();
            showToast('Project deleted');
        }

        window.onload = function() {
            initTheme();
            renderView();
        }
    </script>
